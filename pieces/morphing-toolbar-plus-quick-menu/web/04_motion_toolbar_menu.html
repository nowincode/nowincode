<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbar Menu</title>
<style>
  :root { --page: #e9e8ee; --ink: #1c1c1f; --muted: #77767d; --chip: #ffffffcc; --chip-on: #1c1c1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink);
    font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  #stage { width: min(720px, calc(100vw - 32px), calc(100vh - 120px)); aspect-ratio: 1; border-radius: 22px; overflow: hidden;
    box-shadow: 0 1px 2px #0000000f, 0 12px 40px #00000014; touch-action: none; cursor: pointer; background: #e4e2ea; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .bar button { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--chip); color: var(--ink); font: inherit; cursor: pointer;
    box-shadow: 0 0 0 1px #00000010; }
  .bar button[aria-pressed="true"] { background: var(--chip-on); color: #fff; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; }
  body.capture .bar, body.capture .hint { display: none; }
  body.capture { padding: 0; background: #e4e2ea; }
  body.capture #stage { width: 100vmin; border-radius: 0; box-shadow: none; }
</style>
<!-- nic:screen-mode: ?screen renders only the app screen, edge to edge (nowincode capture) -->
<script>if(new URLSearchParams(location.search).has('screen'))document.documentElement.classList.add('nic-screen')</script>
<style>html.nic-screen,html.nic-screen body{margin:0!important;padding:0!important;width:720px!important;height:720px!important;min-height:0!important;overflow:hidden!important}html.nic-screen #stage{position:fixed!important;left:0!important;top:0!important;margin:0!important;border-radius:0!important;transform:none!important;box-shadow:none!important;zoom:1.00000;width:720px!important;height:720.00px!important;z-index:2147483000}html.nic-screen .bar,html.nic-screen .hint{display:none!important}html.nic-screen body>*:has(#stage){position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;overflow:hidden!important;margin:0!important}html.nic-screen body>*:not(:has(#stage)):not(#stage):not(script):not(style){display:none!important}</style>
<!-- /nic:screen-mode -->
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="bar">
  <button id="demo" aria-pressed="true">演示回放</button>
  <button id="live" aria-pressed="false">自己操作</button>
  <button id="slow" aria-pressed="false">慢放 ×0.25</button>
</div>
<div class="hint">点 + 展开菜单，点菜单项或 × 收起；菜单收起时点任意 tab 切换（按住可看玻璃透镜）</div>
<script src="04_motion_toolbar_menu_core.js"></script>
<script src="ck_adapter.js"></script>
<script>
(function () {
  const Core = window.ToolbarMenuCore;
  const q = new URLSearchParams(location.search);
  const frozenT = q.has('t') ? +q.get('t') : null;
  if (frozenT != null || q.has('capture')) document.body.classList.add('capture');
  const local = location.protocol !== 'file:';
  const base = local ? 'vendor/' : 'https://unpkg.com/canvaskit-wasm@0.40.0/bin/';
  const s = document.createElement('script');
  s.src = base + 'canvaskit.js';
  s.onload = () => CanvasKitInit({ locateFile: f => base + f }).then(start);
  document.head.appendChild(s);

  function start(CK) {
    const cv = document.getElementById('cv'), stage = document.getElementById('stage');
    let surface = null, assets = null, A = null, pxScale = 1;

    // labels are rasterised by the browser's system font (SF on macOS) and handed to Skia as images
    const labelCache = {};
    function label(c, text, cx, base, size, weight, color, scale) {
      const key = [text, size, weight, scale].join('|');
      let img = labelCache[key];
      const W = 120, H = size * 2;
      if (!img) {
        const t = document.createElement('canvas');
        t.width = Math.ceil(W * scale); t.height = Math.ceil(H * scale);
        const g = t.getContext('2d');
        g.font = weight + ' ' + (size * scale) + 'px -apple-system, "SF Pro Text", system-ui, sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        g.fillStyle = 'rgba(' + color.slice(0, 3).map(v => Math.round(v * 255)).join(',') + ',' + color[3] + ')';
        g.fillText(text, t.width / 2, size * 1.4 * scale);
        img = labelCache[key] = CK.MakeImageFromCanvasImageSource(t);
      }
      const p = new CK.Paint(); p.setAntiAlias(true);
      c.drawImageRect(img, CK.XYWHRect(0, 0, img.width(), img.height()), CK.XYWHRect(cx - W / 2, base - size * 1.4, W, H), p);
      p.delete();
    }

    function setup() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const css = stage.getBoundingClientRect().width;
      cv.width = Math.round(css * dpr); cv.height = cv.width;
      if (surface) surface.delete();
      surface = CK.MakeWebGLCanvasSurface(cv) || CK.MakeSWCanvasSurface(cv);
      pxScale = cv.width / Core.STAGE;
      A = makeCKAdapter(CK, label);
      const bakeScale = pxScale * 1.1;
      assets = Core.bake(A, bakeScale);
      assets.tiles = Core.bakeTiles(A, bakeScale);
    }
    setup();
    let resizeT = 0;
    window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(setup, 120); });

    // clock: virtual time so slow motion keeps every timeline consistent
    let mode = q.get('mode') === 'live' ? 'live' : 'demo', speed = 1, vt = 0, last = performance.now();
    let S = Core.makeState();
    function shift(st, dt) {
      const out = JSON.parse(JSON.stringify(st));
      const keys = ['t0', 'down', 'up', 'rel', 'tq', 'tr'];
      (function walk(o) { for (const k in o) { if (o[k] && typeof o[k] === 'object') walk(o[k]); else if (keys.includes(k) && typeof o[k] === 'number') o[k] += dt; } })(out);
      return out;
    }
    function setMode(m) {
      if (m === 'live' && mode === 'demo') { const t = vt % Core.DEMO_LEN; S = shift(Core.demoState(t), vt - t); }
      if (m === 'demo') vt = 0;
      mode = m;
      document.getElementById('demo').setAttribute('aria-pressed', m === 'demo');
      document.getElementById('live').setAttribute('aria-pressed', m === 'live');
    }
    document.getElementById('demo').onclick = () => setMode('demo');
    document.getElementById('live').onclick = () => setMode('live');
    const slowBtn = document.getElementById('slow');
    slowBtn.onclick = () => { speed = speed === 1 ? 0.25 : 1; slowBtn.setAttribute('aria-pressed', speed !== 1); };
    setMode(mode);

    function toLocal(e) {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * Core.STAGE, (e.clientY - r.top) / r.height * Core.STAGE - Core.STAGE_OY];
    }
    cv.addEventListener('pointerdown', e => {
      if (frozenT != null) return;
      if (mode === 'demo') setMode('live');
      const p = toLocal(e);
      Core.down(S, p[0], p[1], vt);
    });
    window.addEventListener('pointerup', () => { if (mode === 'live') Core.up(S, vt); });
    window.addEventListener('pointercancel', () => { if (mode === 'live') Core.up(S, vt); });

    function render(t, st) {
      const c = surface.getCanvas();
      c.clear(CK.WHITE);
      c.save(); c.scale(pxScale, pxScale);
      Core.drawBackground(c, A, Core.STAGE, Core.STAGE, 0);
      c.translate(0, Core.STAGE_OY);
      const D = Core.frame(st, t);
      Core.draw(c, A, D, assets);
      c.restore();
      surface.flush();
      window.__state = { t: Math.round(t), open: st.open, tab: st.tab, shape: D.shape, plus: D.plus, pill: D.pill };
    }
    if (frozenT != null) { render(frozenT, Core.demoState(frozenT)); window.__ready = true; return; }
    function tick(now) {
      vt += Math.min(now - last, 50) * speed; last = now;
      if (mode === 'demo') { const t = vt % Core.DEMO_LEN; render(t, Core.demoState(t)); }
      else render(vt, S);
      window.__ready = true;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(t => { last = t; tick(t); });
  }
})();
</script>
</body>
</html>
